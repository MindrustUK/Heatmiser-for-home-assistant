name: Bug report
description: Create a report to help us improve
body:
  - type: markdown
    attributes:
      value: |
        Before raising a bug, please read the [documentation](https://mindrustuk.github.io/Heatmiser-for-home-assistant/).
  - type: textarea
    validations:
      required: true
    attributes:
      label: The problem
      description: >-
        A clear and concise description of what the bug is. Tell us what you were trying to do and what happened.

        Provide a clear and concise description of what the problem is.
  - type: markdown
    attributes:
      value: |
        # Details
  - type: textarea
    attributes:
      label: Diagnostics information
      placeholder: "drag-and-drop the diagnostics data file here (do not copy-and-paste the content)"
      description: >-
        Always include [diagnostic data](https://www.home-assistant.io/docs/configuration/troubleshooting/#download-diagnostics).

        **It would really help if you could download the diagnostics data,
        and <ins>drag-and-drop that file into the textbox below.</ins>**

        It generally allows pinpointing defects and thus resolving issues faster.
  - type: textarea
    attributes:
      label: Example YAML snippet
      description: |
        If applicable, please provide an example piece of YAML that can help reproduce this problem.
        This can be from an automation, script, scene or configuration.
      render: yaml
  - type: textarea
    attributes:
      label: Anything in the logs that might be useful for us?
      description: For example, error message, or stack traces.
      render: txt
  - type: textarea
    attributes:
      label: Additional information
      description: >
        If you have any additional information for us, use the field below.
